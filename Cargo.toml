[package]
name = "brewsty"
version = "0.7.0"
edition = "2024"

[features]
default = []
verbose-logging = []

[dependencies]
eframe = "0.33"
egui = "0.33"
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0"
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.17"
egui_extras = "0.33"
tracing-appender = "0.2.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3

[package.metadata.bundle]
name = "Brewsty"
identifier = "com.brewsty.app"
category = "public.app-category.utilities"
short_description = "A GUI for managing Homebrew packages and services"
osx_minimum_system_version = "10.15"
